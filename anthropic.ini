# 内容：Anthropic / Claude 分流规则（共 8 条）
# 由 clash.ini 的 ruleset 引用，命中后交给「💬 Anthropic」策略组。
# 本文件只负责域名匹配；具体出口由 clash.ini 中的策略组及客户端当前选择决定。
# 规则按顺序匹配，命中后不再继续检查后面的规则。

# 关键词匹配：域名任意位置包含 anthropic 或 claude 即命中。
# 覆盖范围较宽，也会匹配名称含这些关键词的第三方域名。
DOMAIN-KEYWORD,anthropic
DOMAIN-KEYWORD,claude

# 域名后缀匹配：包含根域名及其所有子域名。
# 以下 Claude / Anthropic 域名也被上面的关键词覆盖，显式保留便于维护。
# Anthropic 主域名及 API，例如 api.anthropic.com，无需单独重复添加 API 规则。
DOMAIN-SUFFIX,anthropic.com
# Claude 网页服务域名。
DOMAIN-SUFFIX,claude.ai
# Claude 产品站域名。
DOMAIN-SUFFIX,claude.com
# Claude 用户内容相关域名。
DOMAIN-SUFFIX,claudeusercontent.com

# Segment 公共分析服务：其他应用访问这些域名也会使用 Anthropic 策略组。
# 按参考文章建议保留；是否为当前使用功能所必需，需结合实际连接日志判断。
# 参考：https://deusyu.app/posts/clash-claude-split/
DOMAIN-SUFFIX,segment.io
DOMAIN-SUFFIX,segment.com
